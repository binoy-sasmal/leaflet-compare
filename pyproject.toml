[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "leaflet-compare"
version = "0.1.0"
description = "Local OCR document comparison with synthetic evaluation and source evidence"
requires-python = ">=3.12,<3.13"
dependencies = ["rapidocr-onnxruntime==1.4.4", "pypdfium2>=4", "pdfplumber>=0.11", "reportlab>=4", "pillow>=10", "streamlit>=1.40"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
leaflet-compare = "leaflet_compare.cli:main"
[tool.setuptools.packages.find]
include = ["leaflet_compare*"]
[tool.pytest.ini_options]
markers = ["ocr: local OCR integration tests"]
testpaths = ["tests"]
